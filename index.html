<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Tráfico de Catalunya</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

    <style>
        /* Base styles to ensure full height */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling of the whole page */
        }

        /* Custom scrollbar for the sidebar */
        #sidebar::-webkit-scrollbar {
            width: 8px;
        }
        #sidebar::-webkit-scrollbar-track {
            background: #1f2937; /* gray-800 */
        }
        #sidebar::-webkit-scrollbar-thumb {
            background: #4b5563; /* gray-600 */
            border-radius: 4px;
        }
        #sidebar::-webkit-scrollbar-thumb:hover {
            background: #6b7280; /* gray-500 */
        }

        /* Hide the default Leaflet Routing Machine itinerary container to keep UI clean */
        .leaflet-routing-container {
            display: none !important;
        }

        /* Custom camera icon styling */
        .camera-icon {
            font-size: 24px;
            text-align: center;
            line-height: 24px;
            text-shadow: 0px 0px 4px rgba(255, 255, 255, 0.8);
        }

        /* Blinking red dot animation for "REC" state */
        @keyframes pulse-red {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        .rec-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #ef4444; /* text-red-500 */
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse-red 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex h-screen w-screen bg-gray-900 text-white font-sans">

    <!-- Sidebar Container -->
    <div id="sidebar" class="w-[350px] h-full flex flex-col border-r border-gray-700 bg-gray-900 z-10 flex-shrink-0 shadow-xl overflow-y-auto">
        <div class="p-6 border-b border-gray-700 sticky top-0 bg-gray-900 z-20 shadow-md">
            <h1 class="text-2xl font-bold text-white flex items-center">
                <span class="mr-2">🎥</span> Cámaras en Ruta
            </h1>
            <p class="text-gray-400 text-sm mt-2">
                Haz clic en cualquier punto del mapa para establecer un destino. Las cámaras de tráfico activas a menos de 10km de tu ruta aparecerán aquí.
            </p>
            <div class="mt-4 p-3 bg-gray-800 rounded-lg text-sm border border-gray-700">
                <span class="font-semibold text-blue-400">Origen:</span> Roda de Barà
            </div>
        </div>

        <!-- Camera List Container -->
        <div id="camera-list" class="p-4 flex-1">
            <!-- Initial state message -->
            <div id="empty-state" class="text-center text-gray-500 mt-10">
                <svg class="w-16 h-16 mx-auto mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                <p>Selecciona un destino en el mapa para iniciar.</p>
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map" class="flex-1 h-full w-full z-0 relative"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Leaflet Routing Machine JS -->
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
        // Configuration Constants
        const ORIGIN_LAT = 41.1833;
        const ORIGIN_LNG = 1.4500;
        const ORIGIN_NAME = "Roda de Barà";
        const PROXIMITY_THRESHOLD_KM = 10;

        // Realistic cameras array across Catalunya
        const cameras = [
            { id: 1, name: "AP-7 Roda de Barà", lat: 41.183, lng: 1.450 },
            { id: 2, name: "AP-7 Vilafranca", lat: 41.346, lng: 1.698 },
            { id: 3, name: "C-32 Sitges", lat: 41.236, lng: 1.801 },
            { id: 4, name: "AP-7 Martorell", lat: 41.474, lng: 1.928 },
            { id: 5, name: "B-23 Sant Joan Despí", lat: 41.373, lng: 2.057 },
            { id: 6, name: "C-16 Sant Cugat", lat: 41.464, lng: 2.072 },
            { id: 7, name: "C-58 Sabadell", lat: 41.530, lng: 2.100 },
            { id: 8, name: "C-33 Mollet", lat: 41.536, lng: 2.213 },
            { id: 9, name: "AP-7 Granollers", lat: 41.603, lng: 2.296 },
            { id: 10, name: "AP-7 Girona", lat: 41.979, lng: 2.818 },
            { id: 11, name: "A-2 Igualada", lat: 41.583, lng: 1.621 },
            { id: 12, name: "A-2 Lleida", lat: 41.616, lng: 0.622 },
            { id: 13, name: "C-25 Manresa", lat: 41.733, lng: 1.826 },
            { id: 14, name: "C-25 Vic", lat: 41.930, lng: 2.254 },
            { id: 15, name: "N-340 L'Aldea", lat: 40.738, lng: 0.620 }
        ];

        // Initialize Map centered over Catalunya
        const map = L.map('map').setView([41.5912, 1.5209], 8);

        // Add OpenStreetMap tiles
		L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
		attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
		}).addTo(map);

        // Custom divIcon for cameras
        const cameraIcon = L.divIcon({
            html: '📷',
            className: 'camera-icon',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
        });

        // Custom icon for the Origin
        const originIcon = L.divIcon({
            html: '📍',
            className: 'text-3xl',
            iconSize: [30, 30],
            iconAnchor: [15, 30]
        });

        // Add Origin Marker
        const originMarker = L.marker([ORIGIN_LAT, ORIGIN_LNG], { icon: originIcon, zIndexOffset: 1000 })
            .addTo(map)
            .bindPopup(`<b>Origen Fijo</b><br>${ORIGIN_NAME}`);

        // Add Camera Markers to the map
        cameras.forEach(cam => {
            L.marker([cam.lat, cam.lng], { icon: cameraIcon })
                .addTo(map)
                .bindPopup(`<b>Cámara:</b> ${cam.name}`);
        });

        // Global reference to the routing control
        let routingControl = null;
        let destinationMarker = null;

        // Function to calculate distance between two coordinates in km
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radius of the earth in km
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const d = R * c; // Distance in km
            return d;
        }

        function deg2rad(deg) {
            return deg * (Math.PI / 180)
        }

        // Listen to map clicks to set destination
        map.on('click', function(e) {
            const destLat = e.latlng.lat;
            const destLng = e.latlng.lng;

            // Update or create destination marker
            if (destinationMarker) {
                destinationMarker.setLatLng(e.latlng);
            } else {
                destinationMarker = L.marker(e.latlng, { icon: L.divIcon({ html: '🎯', className: 'text-3xl', iconSize: [30, 30], iconAnchor: [15, 30] }), zIndexOffset: 1000 })
                    .addTo(map)
                    .bindPopup("Destino");
            }

            // Show loading state in sidebar
            const cameraListEl = document.getElementById('camera-list');
            cameraListEl.innerHTML = `
                <div class="flex justify-center items-center h-32">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
                    <span class="ml-3 text-gray-400">Calculando ruta...</span>
                </div>
            `;

            // Setup Routing
            if (routingControl) {
                // If it exists, update waypoints
                routingControl.setWaypoints([
                    L.latLng(ORIGIN_LAT, ORIGIN_LNG),
                    L.latLng(destLat, destLng)
                ]);
            } else {
                // Create routing control
                routingControl = L.Routing.control({
                    waypoints: [
                        L.latLng(ORIGIN_LAT, ORIGIN_LNG),
                        L.latLng(destLat, destLng)
                    ],
                    routeWhileDragging: false,
                    showAlternatives: false,
                    addWaypoints: false,
                    fitSelectedRoutes: true,
                    lineOptions: {
                        styles: [{ color: '#3b82f6', opacity: 0.8, weight: 6 }]
                    },
                    createMarker: function() { return null; } // Prevent default markers from routing machine
                }).addTo(map);

                // Listen to when the route is calculated
                routingControl.on('routesfound', function(e) {
                    const routes = e.routes;
                    const mainRoute = routes[0];
                    const routeCoordinates = mainRoute.coordinates;

                    // Set to store unique active cameras
                    const activeCameras = new Set();

                    // Check which cameras are near any point of the route
                    cameras.forEach(cam => {
                        for (let i = 0; i < routeCoordinates.length; i += 5) { // Skip some points for performance
                            const point = routeCoordinates[i];
                            const distance = getDistanceFromLatLonInKm(cam.lat, cam.lng, point.lat, point.lng);
                            if (distance <= PROXIMITY_THRESHOLD_KM) {
                                activeCameras.add(cam);
                                break; // Once added, no need to check other points for this camera
                            }
                        }
                    });

                    updateSidebar(Array.from(activeCameras));
                });

                // Handle routing errors
                routingControl.on('routingerror', function(e) {
                    cameraListEl.innerHTML = `
                        <div class="p-4 bg-red-900/50 border border-red-500 rounded-lg text-red-200 text-center mt-4">
                            No se pudo calcular la ruta. Intenta seleccionar un lugar más cercano a las carreteras principales.
                        </div>
                    `;
                });
            }
        });

        // Function to render the active cameras in the sidebar
        function updateSidebar(activeCamerasArray) {
            const cameraListEl = document.getElementById('camera-list');
            
            if (activeCamerasArray.length === 0) {
                cameraListEl.innerHTML = `
                    <div class="text-center text-gray-500 mt-10">
                        <svg class="w-16 h-16 mx-auto mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        <p>No se encontraron cámaras activas a menos de ${PROXIMITY_THRESHOLD_KM}km de tu ruta.</p>
                    </div>
                `;
                return;
            }

            let htmlContent = `<div class="mb-4 text-sm text-green-400 font-semibold">${activeCamerasArray.length} cámara(s) detectada(s) en ruta:</div>`;
            
            activeCamerasArray.forEach(cam => {
                // Simulated live feed placeholder
                const imageUrl = `https://placehold.co/400x250/222222/ffffff?text=C%C3%A1mara%0A${encodeURIComponent(cam.name)}`;
                
                htmlContent += `
                    <div class="bg-gray-800 rounded-xl overflow-hidden shadow-lg border border-gray-700 mb-5 transition-transform hover:scale-[1.02]">
                        <!-- Camera Header -->
                        <div class="px-4 py-3 bg-gray-750 flex items-center justify-between border-b border-gray-700">
                            <div class="flex items-center">
                                <span class="rec-dot"></span>
                                <h3 class="font-bold text-gray-100 text-sm tracking-wide">LIVE - ${cam.name}</h3>
                            </div>
                            <span class="text-xs text-gray-500 font-mono border border-gray-600 px-2 py-0.5 rounded">HD</span>
                        </div>
                        
                        <!-- Camera Image -->
                        <div class="relative w-full h-40 bg-black">
                            <img src="${imageUrl}" alt="Feed ${cam.name}" class="w-full h-full object-cover opacity-90" onerror="this.onerror=null; this.src='https://placehold.co/400x250/333/fff?text=Señal+Perdida'">
                            <!-- Overlay elements -->
                            <div class="absolute bottom-2 left-2 text-[10px] text-white bg-black/60 px-1 font-mono rounded">
                                ${new Date().toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit', second:'2-digit'})}
                            </div>
                            <div class="absolute top-2 right-2 flex space-x-1">
                                <div class="w-1.5 h-1.5 bg-green-500 rounded-full"></div>
                                <div class="w-1.5 h-1.5 bg-green-500 rounded-full"></div>
                                <div class="w-1.5 h-1.5 bg-green-500 rounded-full"></div>
                            </div>
                        </div>
                    </div>
                `;
            });

            cameraListEl.innerHTML = htmlContent;
        }
    </script>
</body>
</html>
