<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámaras de Tráfico - Rutas Cam</title>
    
    <!-- Estilos de diseño (Tailwind) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Librerías del Mapa (Leaflet y Routing Machine) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <style>
        body { margin: 0; padding: 0; display: flex; height: 100vh; background-color: #1a1a1a; color: white; }
        #sidebar { width: 380px; background-color: #111827; overflow-y: auto; display: flex; flex-direction: column; }
        #map { flex-grow: 1; height: 100vh; }
        
        /* Personalizar la barra de desplazamiento lateral */
        #sidebar::-webkit-scrollbar { width: 8px; }
        #sidebar::-webkit-scrollbar-track { background: #1f2937; }
        #sidebar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        
        /* Icono de las cámaras en el mapa */
        .icono-cam { font-size: 16px; text-align: center; }
    </style>
</head>
<body>

    <!-- Barra Lateral -->
    <div id="sidebar" class="p-6 shadow-lg z-10 flex-shrink-0 border-r border-gray-800">
        <h1 class="text-2xl font-bold mb-2 flex items-center gap-2">
            🎥 Cámaras en Ruta
        </h1>
        <p class="text-sm text-gray-400 mb-4">
            Haz clic en cualquier punto del mapa para establecer un destino. Las cámaras de tráfico activas a menos de 5km de tu ruta aparecerán aquí.
        </p>
        
        <div class="bg-blue-900/30 border border-blue-800 text-blue-300 px-4 py-2 rounded-md text-sm mb-6">
            <span class="font-bold">Origen:</span> Roda de Barà
        </div>
        
        <!-- CONTENEDOR DINÁMICO: Aquí se inyectarán las fotos reales -->
        <div class="caja-resultados-camaras">
            <!-- Mensaje por defecto antes de hacer clic en el mapa -->
            <div class="flex flex-col items-center justify-center text-gray-500 mt-10 text-center">
                <svg class="w-12 h-12 mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L16 4m0 13V4m0 0L9 7"></path>
                </svg>
                <p>Selecciona un destino en el mapa para iniciar.</p>
            </div>
        </div>
    </div>

    <!-- Contenedor del Mapa -->
    <div id="map"></div>

    <!-- Scripts de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    
    <!-- Lógica de la Aplicación -->
    <script>
        // 1. Inicializar el mapa desde tu municipio
        const origenCoords = [41.1833, 1.4500];
        const map = L.map('map').setView(origenCoords, 9);

        // Mapa base de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        L.marker(origenCoords).addTo(map).bindPopup('Origen Fijo<br>Roda de Barà');
        
        let controlRuta = null;
        let todasLasCamaras = [];

        // 2. Cargar datos reales de la Generalitat
        async function cargarCamarasOficiales() {
            try {
                const respuesta = await fetch("https://analisi.transparenciacatalunya.cat/resource/yqwd-vj5e.json");
                const datos = await respuesta.json();
                
                todasLasCamaras = datos.map(cam => {
                    return {
                        nombre: cam.carretera + (cam.quil_metre ? " (Km " + cam.quil_metre + ")" : ""),
                        lat: parseFloat(cam.latitud),
                        lng: parseFloat(cam.longitud),
                        urlImagen: cam.url
                    };
                }).filter(cam => !isNaN(cam.lat) && !isNaN(cam.lng) && cam.urlImagen);

                todasLasCamaras.forEach(cam => {
                    const iconoCamara = L.divIcon({ html: '📷', className: 'icono-cam', iconSize: [20, 20] });
                    L.marker([cam.lat, cam.lng], {icon: iconoCamara})
                     .bindPopup(`<b>${cam.nombre}</b>`)
                     .addTo(map);
                });
            } catch (error) {
                console.error("Error cargando cámaras oficiales:", error);
            }
        }

        // 3. Trazar ruta al hacer clic en el mapa
        map.on('click', function(e) {
            const destinoCoords = e.latlng;
            if (controlRuta) { map.removeControl(controlRuta); }

            controlRuta = L.Routing.control({
                waypoints: [ L.latLng(origenCoords[0], origenCoords[1]), destinoCoords ],
                language: 'es',
                show: false,
                createMarker: function(i, wp, nWps) {
                    if (i === nWps - 1) return L.marker(wp.latLng).bindPopup('Destino');
                    return null;
                }
            }).on('routesfound', function(e) {
                actualizarBarraLateral(e.routes[0].coordinates);
            }).addTo(map);
        });

        // 4. Calcular distancia matemática
        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // 5. Mostrar fotos en la barra lateral
        function actualizarBarraLateral(coordenadasRuta) {
            const camarasEnRuta = todasLasCamaras.filter(cam => {
                return coordenadasRuta.some(punto => calcularDistancia(cam.lat, cam.lng, punto.lat, punto.lng) < 5);
            });

            let html = `<h3 class="font-bold text-lg mb-4 text-green-400">${camarasEnRuta.length} cámara(s) detectada(s)</h3>`;
            
            if(camarasEnRuta.length === 0) {
                html += `<p class="text-gray-400 text-sm">No hay cámaras de la Generalitat a menos de 5km de esta ruta.</p>`;
            }

            camarasEnRuta.forEach(cam => {
                const imagenRefresh = `${cam.urlImagen}?t=${new Date().getTime()}`;
                html += `
                    <div class="bg-gray-800 mb-4 p-3 rounded-lg border border-gray-700 shadow-sm">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                            <p class="text-white text-sm font-bold uppercase tracking-wider truncate" title="${cam.nombre}">${cam.nombre}</p>
                        </div>
                        <img src="${imagenRefresh}" class="w-full rounded border border-gray-600" alt="Cámara ${cam.nombre}" onerror="this.src='https://via.placeholder.com/400x225/333333/ffffff?text=Se%C3%B1al+Perdida'">
                    </div>
                `;
            });
            
            document.querySelector('.caja-resultados-camaras').innerHTML = html;
        }

        cargarCamarasOficiales();
    </script>
</body>
</html>
